services:
  web:
    build: .
    ports:
      - "3000:80"
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SAMPLE_EXTERNAL_APP_URL: ${SAMPLE_EXTERNAL_APP_URL:-https://the-internet.herokuapp.com}
    volumes:
      - db_data:/rails/storage
      - ./opencode/data:/home/rails/.local/share/opencode
      - ./opencode/config:/home/rails/.config/opencode

  jobs:
    build: .
    command: bin/jobs
    environment:
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SAMPLE_EXTERNAL_APP_URL: ${SAMPLE_EXTERNAL_APP_URL:-https://the-internet.herokuapp.com}
    volumes:
      - db_data:/rails/storage
      - ./opencode/data:/home/rails/.local/share/opencode
      - ./opencode/config:/home/rails/.config/opencode
    depends_on:
      - web

volumes:
  db_data:
